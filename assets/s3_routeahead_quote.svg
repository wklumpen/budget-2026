<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Barlow Condensed";fill:#12171d} .b{font-weight:700} .m{font-weight:500}</style><rect width="1600" height="900" fill="#f2eee4"/><text x="60" y="120" class="b" font-size="96">Council already chose frequency</text><rect x="60" y="160" width="120" height="14" fill="#eb6834"/><rect x="180" y="160" width="120" height="14" fill="#0e8083"/><text x="60" y="310" class="b" font-size="72" style="fill:#0e8083">“By implementing RouteAhead, Calgary</text><text x="60" y="392" class="b" font-size="72" style="fill:#0e8083">will shift more towards frequency</text><text x="60" y="474" class="b" font-size="72" style="fill:#0e8083">to build ridership …”</text><text x="60" y="620" class="m" font-size="44">The Primary Transit Network: “service running every 10 minutes or better,</text><text x="60" y="674" class="m" font-size="44">at least 15 hours a day, seven days a week.”</text><text x="60" y="860" font-size="26" style="fill:#6e7884">RouteAhead, Calgary Transit’s 30-Year Strategic Plan. Approved by Council July 2023. Pages 5 and 40.</text></svg>