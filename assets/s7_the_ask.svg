<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Barlow Condensed";fill:#12171d} .b{font-weight:700} .m{font-weight:500}</style><rect width="1600" height="900" fill="#f2eee4"/><text x="60" y="120" class="b" font-size="96">Three requests for Council</text><rect x="60" y="160" width="120" height="14" fill="#eb6834"/><rect x="180" y="160" width="120" height="14" fill="#0e8083"/><text x="60" y="300" class="b" font-size="72" style="fill:#eb6834">1</text><text x="140" y="300" class="b" font-size="62">Budget the two services separately.</text><text x="140" y="350" class="m" font-size="31" style="fill:#47515c">In the 2027–2030 budget, show a coverage line and a frequency line,</text><text x="140" y="390" class="m" font-size="31" style="fill:#47515c">and have Council set the balance between them on purpose.</text><text x="60" y="505" class="b" font-size="72" style="fill:#0e8083">2</text><text x="140" y="505" class="b" font-size="62">Show the impact to both services.</text><text x="140" y="555" class="m" font-size="31" style="fill:#47515c">New community decisions, other major land use changes, and major service adjustments and network</text><text x="140" y="595" class="m" font-size="31" style="fill:#47515c">reconfiguration should report their effect on the coverage and frequency lines before a decision is made.</text><text x="60" y="710" class="b" font-size="72" style="fill:#12171d">3</text><text x="140" y="710" class="b" font-size="62">Ask Calgarians to help decide the balance.</text><text x="140" y="760" class="m" font-size="31" style="fill:#47515c">Put the trade-off to the public directly.</text><text x="60" y="860" class="m" font-size="34" style="fill:#12171d">This is a question about balance, not a call to cut coverage.</text></svg>