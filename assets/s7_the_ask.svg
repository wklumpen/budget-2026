<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Barlow Condensed";fill:#12171d} .b{font-weight:700} .m{font-weight:500}</style><rect width="1600" height="900" fill="#f2eee4"/><text x="60" y="130" class="b" font-size="110">The ask</text><rect x="60" y="190" width="120" height="14" fill="#eb6834"/><rect x="180" y="190" width="120" height="14" fill="#0e8083"/><text x="60" y="400" class="b" font-size="82" style="fill:#eb6834">1</text><text x="150" y="400" class="b" font-size="74">Show the frequency and coverage split</text><text x="150" y="480" class="b" font-size="74">as a visible budget line.</text><text x="60" y="690" class="b" font-size="82" style="fill:#0e8083">2</text><text x="150" y="690" class="b" font-size="74">Have land use decisions report their</text><text x="150" y="770" class="b" font-size="74">effect on each line.</text></svg>