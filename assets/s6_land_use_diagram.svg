<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Barlow Condensed";fill:#12171d} .b{font-weight:700} .m{font-weight:500}</style><rect width="1600" height="900" fill="#f2eee4"/><text x="60" y="110" class="b" font-size="84">Land use sets the split</text><text x="60" y="162" font-size="34" style="fill:#47515c">Decisions made one at a time add up to the balance between the two jobs</text><rect stroke="#eb6834" stroke-width="6" x="60" y="250" width="620" height="100" fill="#fffdf8"/><text x="370.0" y="312.0" text-anchor="middle" class="b" font-size="36" style="fill:#12171d">New communities on the edge</text><rect stroke="#eb6834" stroke-width="6" x="60" y="400" width="620" height="100" fill="#fffdf8"/><text x="370.0" y="462.0" text-anchor="middle" class="b" font-size="36" style="fill:#12171d">Rezoning, and rezoning that doesn't happen</text><rect stroke="#0e8083" stroke-width="6" x="60" y="550" width="620" height="100" fill="#fffdf8"/><text x="370.0" y="612.0" text-anchor="middle" class="b" font-size="36" style="fill:#12171d">Dense growth along corridors</text><rect stroke="#12171d" stroke-width="6" x="60" y="700" width="620" height="100" fill="#fffdf8"/><text x="370.0" y="762.0" text-anchor="middle" class="b" font-size="36" style="fill:#12171d">Transit budget decisions</text><rect x="1040" y="300" width="500" height="180" fill="#eb6834"/><text x="1290.0" y="384.0" text-anchor="middle" class="b" font-size="60" style="fill:#ffffff">Coverage line</text><text x="1290.0" y="424.0" text-anchor="middle" class="m" font-size="36.0" style="fill:#ffffff">not visible in the budget today</text><rect x="1040" y="560" width="500" height="180" fill="#0e8083"/><text x="1290.0" y="644.0" text-anchor="middle" class="b" font-size="60" style="fill:#ffffff">Frequency line</text><text x="1290.0" y="684.0" text-anchor="middle" class="m" font-size="36.0" style="fill:#ffffff">not visible in the budget today</text><defs><marker id="