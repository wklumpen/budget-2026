<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Barlow Condensed";fill:#12171d} .b{font-weight:700} .m{font-weight:500}</style><rect width="1600" height="900" fill="#f2eee4"/><text x="60" y="120" class="b" font-size="96">Either direction is a choice</text><rect x="60" y="200" width="720" height="560" fill="#eb6834"/><text x="110" y="300" class="b" font-size="64" style="fill:#ffffff">Lean toward coverage</text><text x="110" y="400" class="m" font-size="48" style="fill:#ffffff">Service near more people,</text><text x="110" y="466" class="m" font-size="48" style="fill:#ffffff">less often.</text><text x="110" y="532" class="m" font-size="48" style="fill:#ffffff">Ridership will likely shrink.</text><rect x="820" y="200" width="720" height="560" fill="#0e8083"/><text x="870" y="300" class="b" font-size="64" style="fill:#ffffff">Lean toward frequency</text><text x="870" y="400" class="m" font-size="48" style="fill:#ffffff">Service more often</text><text x="870" y="466" class="m" font-size="48" style="fill:#ffffff">on fewer corridors.</text><text x="870" y="532" class="m" font-size="48" style="fill:#ffffff">Ridership will likely grow,</text><text x="870" y="598" class="m" font-size="48" style="fill:#ffffff">with a plan for edge areas.</text><text x="60" y="850" class="m" font-size="34">The point is to choose it on purpose, in the open.</text></svg>